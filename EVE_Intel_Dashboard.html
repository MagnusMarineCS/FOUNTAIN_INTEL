<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVE Intel Guard - Web Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: #111111;
            --border-color: #333333;
            --text-main: #aaaaaa;
            --text-accent: #4da6ff;
            --accent-green: #00ff00;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: 350px; background-color: var(--panel-bg); border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; padding: 20px; box-shadow: 5px 0 15px rgba(0,0,0,0.8);
            z-index: 10;
        }

        .header {
            display: flex;
            align-items: center;
            font-size: 24px; font-weight: 700; color: var(--accent-green);
            margin-bottom: 15px; text-shadow: 0 0 10px rgba(0, 255, 0, 0.4);
            border-bottom: 1px solid var(--border-color); padding-bottom: 10px;
            justify-content: space-between;
        }

        .header.status-offline {
            color: #ff333c;
            text-shadow: 0 0 10px rgba(255, 51, 60, 0.4);
        }
        .header.status-offline .oscillator {
            display: none;
        }

        .header-title {
            display: flex;
            align-items: center;
        }

        #settings-icon {
            width: 24px;
            height: 24px;
            cursor: pointer;
            transition: transform 0.5s;
        }
        #settings-icon:hover { transform: rotate(90deg); }

        .controls { margin-bottom: 15px; }
        .controls label { font-size: 12px; color: #888; display: block; margin-bottom: 5px;}
        select {
            width: 100%; padding: 8px; background: #000; color: #fff;
            border: 1px solid var(--border-color); font-family: 'Rajdhani', sans-serif;
            font-size: 16px; font-weight: bold; margin-bottom: 10px;
        }

        .traffic-lights {
            height: 40px;
            margin-bottom: 20px;
            /* padding: 15px; */
            background: #000;
            border: 1px solid var(--border-color); border-radius: 5px;
            transition: background-color 0.2s ease, box-shadow 0.2s ease;
            /* Added for text centering */
            flex-shrink: 0; /* Prevent the bar from shrinking if sidebar content overflows */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
            color: black;
            text-transform: uppercase;
        }
        .traffic-lights.status-green {
            background-color: #00ff00;
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.7);
        }
        .traffic-lights.status-yellow {
            background-color: #fcee0a;
            box-shadow: 0 0 25px rgba(252, 238, 10, 0.7);
        }
        .traffic-lights.status-red {
            background-color: #ff333c;
            box-shadow: 0 0 25px rgba(255, 51, 60, 0.7);
        }
        .traffic-lights.status-orange {
            background-color: #ff4500; /* Brighter Emergency Orange */
            box-shadow: 0 0 25px rgba(255, 69, 0, 0.7);
        }

        .log-feed {
            flex: 1 1 auto; min-height: 0; background-color: #000; border: 1px solid var(--border-color);
            padding: 10px; font-family: Consolas, "Courier New", "SimSun", "Microsoft YaHei", monospace; font-size: 14px; color: #888; overflow-y: auto;
        }

        .log-entry { margin-bottom: 8px; word-wrap: break-word; }
        .log-time { color: #555; }
        .log-hostile { color: #ff333c; text-shadow: 0 0 5px rgba(255,51,60,0.5); }
        .log-spike { color: #ff8c00; font-weight: bold; text-shadow: 0 0 8px rgba(255,140,0,0.6); }        
        .log-entry .ship-tag {
            color: #4CAF50; /* Green */
            font-weight: bold;
            cursor: pointer;
            text-decoration: underline;
        }
        .log-kill { color: #00ff00; }
        .log-link { color: #4da6ff; text-decoration: underline; }

        #map-container {
            flex-grow: 1; position: relative;
            background: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%);
            transition: background 1.5s ease;
        }

        canvas { display: block; width: 100%; height: 100%; }

        .map-title {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 40px;
            font-weight: 700;
            color: var(--accent-green);
            text-shadow: 0 0 15px rgba(0, 255, 0, 0.4);
            pointer-events: none;
            line-height: 1;
        }

        .system-readout {
            position: absolute; top: 60px; left: 20px;
            font-size: 24px; font-weight: 700; color: #fff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            pointer-events: none;
        }

        .map-controls {
            position: absolute; top: 100px; left: 20px;
            display: flex; flex-direction: column; align-items: flex-start; gap: 12px; z-index: 5;
        }
        .map-control-item {
            display: flex; align-items: center; gap: 10px;
        }
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333; transition: .4s; border-radius: 20px;
            border: 1px solid var(--border-color);
        }
        .slider:before {
            position: absolute; content: ""; height: 14px; width: 14px; left: 2px; bottom: 2px;
            background-color: #888; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--accent-green); border-color: var(--accent-green); }
        input:checked + .slider:before { transform: translateX(20px); background-color: #000; }
        .toggle-text { color: #888; font-size: 14px; font-weight: bold; }
        input:checked ~ .toggle-text { color: var(--accent-green); text-shadow: 0 0 8px rgba(0,255,0,0.4); }

        #resetViewBtn {
            background-color: #000;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            font-weight: bold;
            padding: 4px 7px 2px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 3px;
        }
        #resetViewBtn:hover {
            background-color: var(--accent-green);
            color: #000;
            border-color: var(--accent-green);
        }

        .volume-control-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .mute-label {
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            font-size: 16px;
            padding: 5px 8px;
            border-radius: 3px;
            cursor: pointer;
            transition: background-color: 0.2s ease;
        }
        .mute-label:hover {
            background-color: #2a2a2a;
        }
        .mute-label input[type="checkbox"] {
            transform: scale(1.3);
            cursor: pointer;
        }
        .test-btn {
            background-color: #1a1a1a;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            font-weight: bold;
            padding: 4px 7px 2px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 3px;
            width: 180px;
            text-align: center;
        }
        .test-btn:hover {
            color: #000;
        }
        #testRedBtn:hover { background-color: #ff333c; border-color: #ff333c; }
        #testYellowBtn:hover { background-color: #fcee0a; border-color: #fcee0a; }
        #testSpikeBtn:hover { background-color: #ff4500; border-color: #ff4500; }

        #ship-info-box {
            position: absolute;
            top: 210px; /* Positioned under the map controls */
            left: 20px;
            width: 255px;
            max-height: calc(100vh - 320px); /* Avoid covering search box */
            overflow-y: auto;
            background-color: rgba(20, 20, 20, 0.9);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 15px;
            color: var(--text-main);
            z-index: 1000;
            font-family: sans-serif;
            font-size: 14px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            display: none; /* Initially hidden */
        }

        .ship-info-entry {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }
        .ship-info-entry:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .ship-info-entry h3 {
            color: var(--text-accent);
            margin-top: 0;
            margin-bottom: 5px;
            font-family: 'Rajdhani', sans-serif;
        }

        .ship-info-entry p {
            margin: 0 0 10px 0;
            font-size: 0.9em;
            color: #aaa;
        }

        .ship-bonuses {
            padding-left: 15px;
            font-family: monospace;
            font-size: 13px;
        }

        .ship-bonuses div { margin-bottom: 5px; }

        .ship-info-compact {
            padding: 5px 0;
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ship-info-compact:last-child { border-bottom: none; }
        .ship-info-compact strong { color: var(--text-accent); }

        .expand-btn {
            background: #333;
            border: 1px solid #555;
            color: #ccc;
            cursor: pointer;
            font-family: monospace;
            font-size: 12px;
            padding: 0px 5px;
            border-radius: 3px;
            margin-left: 10px;
        }
        .expand-btn:hover { background: var(--text-accent); color: #000; }

        #ship-image-container {
            width: 100%;
            height: 120px;
            position: relative;
            margin: 15px 0;
            display: none;
        }

        .ship-image {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 90%;
            max-height: 90%;
            filter: brightness(0) invert(1);
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        .ship-image.visible {
            opacity: 1;
        }

        #fullscreenBtn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 36px;
            height: 36px;
            padding: 6px;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.2s;
        }
        #fullscreenBtn:hover {
            background-color: var(--accent-green);
            color: #000;
            border-color: var(--accent-green);
        }
        #eve-time {
            position: absolute;
            top: 28px;
            right: 70px;
            z-index: 10;
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            font-weight: bold;
            font-size: 18px;
            text-shadow: 0 0 5px #000;
            display: flex;
            align-items: center;
        }
        .digit-container {
            height: 20px;
            width: 11px;
            overflow: hidden;
            position: relative;
        }
        .digit-strip {
            position: absolute;
            top: 0;
            left: 0;
            transition: top 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .digit-strip span {
            display: block;
            height: 20px;
            line-height: 20px;
            text-align: center;
        }
        .time-separator {
            padding: 0 2px;
        }
        .time-label {
            margin-left: 8px;
        }
        #fullscreenBtn svg {
            width: 100%;
            height: 100%;
            fill: currentColor;
        }

        #mapLogo {
            position: absolute; bottom: 20px; right: 20px;
            width: 15vw; min-width: 100px; max-width: 250px; height: auto;
            opacity: 0.6; pointer-events: none;
        }

        #system-search-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 10;
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 3px;
            overflow: hidden;
        }

        #systemSearchInput {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            font-weight: bold;
            font-size: 14px;
            padding: 8px 12px;
            width: 200px;
            outline: none;
            transition: opacity 0.4s ease-in-out;
        }

        #systemSearchInput::placeholder {
            color: #666;
            font-weight: normal;
        }

        #systemSearchBtn {
            background: transparent;
            border: none;
            border-left: 1px solid var(--border-color);
            color: var(--text-main);
            width: 36px;
            height: 36px;
            padding: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        #systemSearchBtn:hover {
            background-color: var(--accent-green);
            color: #000;
        }

        #systemSearchBtn svg {
            width: 100%;
            height: 100%;
            fill: currentColor;
        }

        .oscillator {
            margin-left: 15px;
        }

        .wave-path, .wave-path-2 {
            stroke: var(--accent-green);
            fill: none;
            stroke-width: 2;
        }
        .wave-path-2 {
            stroke-opacity: 0.6;
        }

        #tooltip {
            position: absolute; display: none; background: rgba(0, 0, 0, 0.95);
            border: 1px solid var(--border-color); box-shadow: 0 0 15px rgba(255, 51, 60, 0.4);
            padding: 10px; color: #fff; font-family: monospace; font-size: 13px;
            pointer-events: none; z-index: 1000; max-width: 350px; word-wrap: break-word;
        }

        #settings-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 2000; display: flex;
            justify-content: center; align-items: center; opacity: 0;
            transition: opacity 0.3s;
        }
        #settings-modal.modal-visible { opacity: 1; }
        #settings-modal.modal-hidden { pointer-events: none; }
        #settings-panel {
            background: var(--panel-bg); border: 1px solid var(--border-color);
            padding: 25px; border-radius: 5px; width: 400px;
            box-shadow: 0 0 30px rgba(0,255,0,0.2);
        }
        #settings-panel h2 {
            color: var(--accent-green); text-align: center; margin-bottom: 20px;
        }
        .setting-item { margin-bottom: 15px; }
        .setting-item > label {
            display: block; color: #888; margin-bottom: 5px; font-size: 14px;
        }
        #settings-panel input:not([type="checkbox"]) {
            width: 100%; padding: 8px; background: #000; color: #fff;
            border: 1px solid var(--border-color); font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
        }
        #save-settings {
            width: 100%; padding: 10px; background: var(--accent-green);
            color: #000; border: none; font-family: 'Rajdhani', sans-serif;
            font-size: 18px; font-weight: bold; cursor: pointer;
            margin-top: 10px; transition: background 0.2s;
        }
        #save-settings:hover { background: #fff; }

        .modal-hidden {
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="header status-offline">
            <div class="header-title">
                <span id="system-status-text">SYSTEM OFFLINE</span>
                <svg class="oscillator" width="60" height="20" viewBox="0 0 60 20">
                  <path class="wave-path" d="M 0 10 C 10 0, 20 20, 30 10 S 50 0, 60 10">
                    <animate attributeName="d" values="M 0 10 C 10 0, 20 20, 30 10 S 50 0, 60 10; M 0 10 C 10 20, 20 0, 30 10 S 50 20, 60 10; M 0 10 C 10 0, 20 20, 30 10 S 50 0, 60 10" dur="1.5s" repeatCount="indefinite"></animate>
                  </path>
                  <path class="wave-path-2" d="M 0 10 C 10 20, 20 0, 30 10 S 50 20, 60 10">
                     <animate attributeName="d" values="M 0 10 C 10 20, 20 0, 30 10 S 50 20, 60 10; M 0 10 C 10 0, 20 20, 30 10 S 50 0, 60 10; M 0 10 C 10 20, 20 0, 30 10 S 50 20, 60 10" dur="1.5s" repeatCount="indefinite"></animate>
                  </path>
                </svg>
            </div>
            <img src="gearicon.png" id="settings-icon" alt="Settings">
        </div>
        <div class="controls">
            <label>SELECT CURRENT SYSTEM:</label>
            <select id="systemSelect"></select>
        </div>
        <div class="traffic-lights"></div>
        <div class="log-feed">
            <div class="log-entry">
                <span class="log-time">[System]</span> Awaiting WebSocket connection...
            </div>
        </div>
    </div>

    <div id="map-container">
        <button id="fullscreenBtn" title="Toggle Fullscreen">
            <svg class="icon-enter-fullscreen" viewBox="0 0 24 24">
                <path d="M5 5v5h2V7h3V5H5zm14 0v5h-2V7h-3V5h5zM5 19v-5h2v3h3v2H5zm14 0v-5h-2v3h-3v2h5z"/>
            </svg>
            <svg class="icon-exit-fullscreen" style="display: none;" viewBox="0 0 24 24">
                <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>
            </svg>
        </button>
        <div id="eve-time">
            <div class="digit-container" data-digit="h1"></div>
            <div class="digit-container" data-digit="h2"></div>
            <div class="time-separator">:</div>
            <div class="digit-container" data-digit="m1"></div>
            <div class="digit-container" data-digit="m2"></div>
            <div class="time-label">EVE</div>
        </div>
        <div class="map-title">FOUNTAIN INTEL</div>
        <div class="system-readout" id="currentSystemText">CURRENT SYSTEM: LOADING...</div>

        <div class="map-controls">
            <div class="map-control-item">
                <label class="switch">
                    <input type="checkbox" id="jbToggle">
                    <span class="slider"></span>
                </label>
                <span class="toggle-text">JUMP BRIDGE OVERLAY</span>
            </div>
            <div class="map-control-item">
                <label class="switch">
                    <input type="checkbox" id="namesToggle">
                    <span class="slider"></span>
                </label>
                <span class="toggle-text">SHOW ALL SYSTEM NAMES</span>
            </div>
            <div class="map-control-item">
                <button id="resetViewBtn">RESET VIEW</button>
            </div>
            <div id="test-controls-container" style="display: none; flex-direction: column; gap: 12px; margin-top: 10px;">
                <div class="map-control-item">
                    <button id="testRedBtn" class="test-btn">SIMULATE RED ALERT</button>
                </div>
                <div class="map-control-item">
                    <button id="testYellowBtn" class="test-btn">SIMULATE YELLOW ALERT</button>
                </div>
                <div class="map-control-item">
                    <button id="testSpikeBtn" class="test-btn">SIMULATE SPIKE ALERT</button>
                </div>
            </div>
        </div>

        <div id="ship-info-box"></div>

        <img id="mapLogo" src="initlogo.png" alt="Alliance Logo">
        <div id="system-search-container">
            <input type="text" id="systemSearchInput" placeholder="SHIP / SYSTEM SEARCH">
            <button id="systemSearchBtn" title="Search">
                <svg viewBox="0 0 24 24">
                    <path fill="currentColor" d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z" />
                </svg>
            </button>
        </div>
        <canvas id="eveMap"></canvas>
    </div>

    <div id="tooltip"></div>

    <audio id="alert-sound" src="hostile.mp3" preload="auto"></audio>

    <div id="settings-modal" class="modal-hidden">
        <div id="settings-panel">
            <h2>Settings</h2>
            <div class="setting-item">
                <label for="alert-duration">Alert Duration (seconds)</label>
                <input type="number" id="alert-duration" min="30" max="600" step="10">
            </div>
            <div class="setting-item">
                <label for="red-alert-dist">Red Alert Distance (jumps)</label>
                <input type="number" id="red-alert-dist" min="0" max="10" step="1">
            </div>
            <div class="setting-item">
                <label for="yellow-alert-dist">Yellow Alert Distance (jumps)</label>
                <input type="number" id="yellow-alert-dist" min="1" max="10" step="1">
            </div>
            <div class="setting-item">
                <label for="volume-slider">Alert Volume</label>
                <div class="volume-control-container">
                    <input type="range" id="volume-slider" min="0" max="1" step="0.05" style="flex-grow: 1;">
                    <label for="mute-toggle" class="mute-label">
                        <input type="checkbox" id="mute-toggle"> Mute
                    </label>
                </div>
            </div>
            <div class="setting-item">
                <div class="map-control-item" style="justify-content: space-between; width: 100%;">
                    <span class="toggle-text" style="color: var(--text-main);">ENABLE FLASH ALERTS</span>
                    <label class="switch">
                        <input type="checkbox" id="flash-alerts-toggle">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
            <div class="setting-item">
                <div class="map-control-item" style="justify-content: space-between; width: 100%;">
                    <span class="toggle-text" style="color: var(--text-main);">ENABLE TEST MODE</span>
                    <label class="switch">
                        <input type="checkbox" id="test-mode-toggle">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
            <button id="save-settings">Save & Close</button>
        </div>
    </div>

    <script id="map-data" type="application/json">
        {
  "MAP_COORDINATES": {
    "006-L3": [-5.690868987559773e+17, 3.287144541550771e+16], "00GD-D": [-5.4237884935587725e+17, 8217861353876928.0],
    "1-5GBW": [-5.649779680790388e+17, 4.930716812326157e+16], "14YI-D": [-5.6086903740210035e+17, 2.259911872316155e+16],

    <script>
        // These will be populated by fetching eve_map_data.json
        let MAP_COORDINATES = {};
        let RAW_CONNECTIONS = [];
        let JUMP_BRIDGES = [];
        let NPC_SYSTEMS = new Set();
        let OUT_OF_REGION_LINKS = {};
        const NPC_COLOR = "#008080";
        
        let HOME_SYSTEM = localStorage.getItem("eveIntelHome") || "00GD-D";
        let ALERT_DURATION = parseInt(localStorage.getItem("eveIntelAlertDuration"), 10) || 180;
        let RED_ALERT_DISTANCE = parseInt(localStorage.getItem("eveIntelRedDistance"), 10) || 1;
        let YELLOW_ALERT_DISTANCE = parseInt(localStorage.getItem("eveIntelYellowDistance"), 10) || 2;
        let alertVolume = parseFloat(localStorage.getItem("eveIntelAlertVolume")) || 0.5;
        let isMuted = localStorage.getItem("eveIntelIsMuted") === 'true';
        let enableFlashAlerts = localStorage.getItem("eveIntelFlashAlerts") !== 'false';
        let isTestMode = localStorage.getItem("eveIntelTestMode") === 'true';
        let activeAlerts = {};
        let systemDistances = {};
        let popAnimations = {};
        let alertStartTimes = {};
        let currentSizeFactor = 1.0;
        let jbEnabled = false;
        let showNamesEnabled = false;
        let activeRouteTarget = null;
        let searchedSystem = null;
        let zoom = 1.0;
        let panX = 0, panY = 0;
        let isPanning = false;
        let lastMouseX = 0, lastMouseY = 0;
        let ALL_SHIP_DATA = {};
        let shipInfoBox; // Will be initialized on first use
        let shipInfoCloseHandler = null;
        let isShipInfoBoxPinned = false;
        let shipImageInterval = null;
        let activeImageIndex = 1;
        let searchResetTimer = null;
        let testAlertTimer = null;

        function clearTestAlerts() {
            // Remove any existing test alerts from the activeAlerts object
            for (const key in activeAlerts) {
                if (key.startsWith('_TEST_')) {
                    delete activeAlerts[key];
                }
            }
        }

        function simulateAlert(type) {
            if (!isTestMode) return;

            // Clear previous test alerts and any running timer
            clearTestAlerts();
            if (testAlertTimer) {
                clearTimeout(testAlertTimer);
            }

            const testSystemName = '_TEST_ALERT_';
            let alertData = {
                dist: 0,
                is_spike: false,
                cleared: false,
                expiry: (Date.now() / 1000) + 10, // Doesn't do anything on front-end, but good practice
                trigger_intel: `Simulated ${type.toUpperCase()} Alert`,
                ships: {},
                pilots: []
            };

            switch(type) {
                case 'red':
                    alertData.dist = RED_ALERT_DISTANCE;
                    break;
                case 'yellow':
                    alertData.dist = YELLOW_ALERT_DISTANCE;
                    break;
                case 'spike':
                    alertData.dist = 0; // Spikes are usually close
                    alertData.is_spike = true;
                    break;
            }

            // Add the new alert
            activeAlerts[testSystemName] = alertData;
            
            // Trigger flashing
            alertStartTimes[testSystemName] = Date.now();

            // Set a timer to clear this alert by marking it as 'cleared'
            testAlertTimer = setTimeout(() => {
                if (activeAlerts[testSystemName]) {
                    activeAlerts[testSystemName].cleared = true;
                }
                // A second timer to remove it completely after it has faded
                setTimeout(() => {
                    delete activeAlerts[testSystemName];
                }, 2000); // Give it time to fade out
            }, 10000); // 10 second duration for test alert
        }

        function showShipInfo(shipName) {
            // This function is called when a ship tag in the log is clicked.
            // It shows the info box and "pins" it.
            displayShipInfo([shipName.toUpperCase()], true);
        }

        function displayShipInfo(shipNames, pinOnClick) {
            if (!shipInfoBox) shipInfoBox = document.getElementById('ship-info-box');

            // Clear any previous image rotation
            if (shipImageInterval) {
                clearInterval(shipImageInterval);
                shipImageInterval = null;
            }

            if (!shipNames || shipNames.length === 0) {
                if (!isShipInfoBoxPinned) {
                    shipInfoBox.style.display = 'none';
                }
                return;
            }

            const primaryShipName = shipNames[0];
            const ship = ALL_SHIP_DATA[primaryShipName];

            // Build the HTML content for the info box
            let html = `
                <div id="ship-image-container">
                    <img id="ship-image-1" class="ship-image" alt="Ship Hull">
                    <img id="ship-image-2" class="ship-image" alt="Ship Hull">
                </div>
            `;

            shipNames.forEach(shipName => {
                const currentShip = ALL_SHIP_DATA[shipName];
                if (currentShip) {
                    const shipId = currentShip.name.replace(/[^a-zA-Z0-9]/g, '');
                    html += `
                        <div class="ship-info-entry" id="ship-info-${shipId}">
                            <div class="ship-info-compact">
                                <div>
                                    <strong>${currentShip.name}</strong><br>
                                    ${currentShip.class}<br>
                                    ${currentShip.faction_category}
                                </div>
                                <button class="expand-btn" data-ship-name="${shipName}">▼</button>
                            </div>
                        </div>
                    `;
                }
            });

            shipInfoBox.innerHTML = html;
            shipInfoBox.style.display = 'block';

            // Now that the HTML is in the DOM, get the elements and set up the image rotation
            const image1 = document.getElementById('ship-image-1');
            const image2 = document.getElementById('ship-image-2');
            const imageContainer = document.getElementById('ship-image-container');

            // Reset image state from any previous viewing
            image1.className = 'ship-image';
            image2.className = 'ship-image';

            if (ship && ship.hull_name) {
                const hullName = ship.hull_name;
                const formattedHullName = encodeURIComponent(hullName);
                const topViewSrc = `top/${formattedHullName}.svg`;

            ws.onmessage = (event) => {

                if (data.type === "init_ship_data") {
                    ALL_SHIP_DATA = data.data;
                    console.log(`Received ship data for ${Object.keys(ALL_SHIP_DATA).length} ships.`);
                    return;
                }

                if (data.type === "alert_update") {
                    const audio = document.getElementById('alert-sound');
                    for (let sys in data.alerts) {
                        if ((!activeAlerts[sys] || activeAlerts[sys].cleared) && !data.alerts[sys].cleared) {
                            popAnimations[sys] = Date.now();
                            alertStartTimes[sys] = Date.now();

                                if (audio) {
                                   audio.play().catch(e => console.warn("Audio play failed, user interaction needed:", e.message));
                                }
                            }
                        }
                    }
                    activeAlerts = data.alerts;
                    if (data.distances) systemDistances = data.distances;

                    if (data.home_system && data.home_system !== HOME_SYSTEM) {
                        HOME_SYSTEM = data.home_system;
                        localStorage.setItem("eveIntelHome", HOME_SYSTEM);
                        document.getElementById("systemSelect").value = HOME_SYSTEM;
                        document.getElementById("currentSystemText").textContent = `CURRENT SYSTEM: ${HOME_SYSTEM}`;
                        if(activeRouteTarget === HOME_SYSTEM) activeRouteTarget = null;

                    document.getElementById("systemSelect").value = HOME_SYSTEM;
                    document.getElementById("currentSystemText").textContent = `CURRENT SYSTEM: ${HOME_SYSTEM}`;

                    </div>`;
                    if(isAtBottom) feed.scrollTop = feed.scrollHeight;
                }

                if (data.type === "log_line") {
                    const feed = document.querySelector('.log-feed');
                    let formattedText = data.text;

                    const urlRegex = /(https?:\/\/[^\s]+)/g;
                    formattedText = data.text.replace(urlRegex, '<a href="$1" target="_blank" class="log-link">$1</a>');

                    // The backend now sends pre-formatted HTML with ship tags, so we don't need to do replacements here.
                    // However, we can still apply general styling.
                    if (formattedText.includes("SPIKE")) {
                        formattedText = `<span class="log-spike">${formattedText}</span>`;
                    } else if (formattedText.includes("CLR") || formattedText.includes("CLEAR") || formattedText.includes("Kill:")) {
                        formattedText = `<span class="log-kill">${formattedText}</span>`;

                    const isAtBottom = feed.scrollHeight - feed.clientHeight <= feed.scrollTop + 10;
                    feed.innerHTML += `<div class="log-entry">

        function findRoute(start, end, useJB) {
            if (start === end) return [start];
            let graph = {};
            const addEdge = (u, v) => {
                if(!graph[u]) graph[u] = [];
                if(!graph[v]) graph[v] = [];
                graph[u].push(v);
                graph[v].push(u);
            };
            RAW_CONNECTIONS.forEach(c => addEdge(c[0], c[1]));
            if(useJB) JUMP_BRIDGES.forEach(c => addEdge(c[0], c[1]));

            let q = [start];
            let visited = { [start]: true };
            let parent = {};

            while(q.length > 0) {
                let curr = q.shift();
                if(curr === end) break;
                if(!graph[curr]) continue;
                for(let neighbor of graph[curr]) {
                    if(!visited[neighbor]) {
                        visited[neighbor] = true;
                        parent[neighbor] = curr;
                        q.push(neighbor);
                    }
                }
            }
            if(!visited[end]) return [];
            let path = [];
            let curr = end;
            while(curr !== undefined) {
                path.push(curr);
                curr = parent[curr];
            }
            return path.reverse();
        }

        function performSearch() {

                searchResetTimer = null;

                .sort((a, b) => (a.score !== b.score) ? a.score - b.score : a.name.length - b.name.length);

            if (matches.length > 0) {

                        // Find the most recent spike alert based on when it was received
                        const spikeTime = alertStartTimes[sys] || 0;

        function blendColors(color1, color2, ratio) {
            if (!color1 || !color2) return "#202020";
            let r1 = parseInt(color1.substring(1,3), 16), g1 = parseInt(color1.substring(3,5), 16), b1 = parseInt(color1.substring(5,7), 16);
            let r2 = parseInt(color2.substring(1,3), 16), g2 = parseInt(color2.substring(3,5), 16), b2 = parseInt(color2.substring(5,7), 16);
            let r = Math.round(r2 + (r1 - r2) * ratio);
            let g = Math.round(g2 + (g1 - g2) * ratio);
            let b = Math.round(b2 + (b1 - b2) * ratio);
            return "#" + (1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1);
        }

        function getContrastYIQ(hexcolor){
            if (!hexcolor) return '#ffffff';
            let hex = hexcolor.replace('#','');
            if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
            let r = parseInt(hex.substr(0,2),16);
            let g = parseInt(hex.substr(2,2),16);
            let b = parseInt(hex.substr(4,2),16);
            let yiq = ((r*299)+(g*587)+(b*114))/1000;
            return (yiq >= 128) ? '#000000' : '#ffffff';
        }

        const canvas = document.getElementById("eveMap");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }

        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        let spanX = 1, spanY = 1;

        function calculateMapBounds() {
            minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            for (let sys in MAP_COORDINATES) {
                let [x, y] = MAP_COORDINATES[sys];
                y = -y; 
                if (x < minX) minX = x; if (x > maxX) maxX = x;
                if (y < minY) minY = y; if (y > maxY) maxY = y;
            }
            spanX = maxX - minX || 1;
            spanY = maxY - minY || 1;
        }

        function toPixels(ex, ey) {
            let w = canvas.width; let h = canvas.height;
            const padding = { top: 60, right: 60, bottom: 60, left: document.fullscreenElement ? 300 : 60 };
            let scaleX = (w - (padding.left + padding.right)) / spanX;
            let scaleY = (h - (padding.top + padding.bottom)) / spanY;
            let scale = Math.min(scaleX, scaleY) * zoom;
            return {
                x: ex * scale + (padding.left + (w - (padding.left + padding.right) - spanX * scale) / 2 - minX * scale) + panX,
                y: (-ey) * scale + (padding.top + (h - (padding.top + padding.bottom) - spanY * scale) / 2 - minY * scale) + panY,
                scale: scale
            };
        }

        function fromPixels(sx, sy) {
            let w = canvas.width; let h = canvas.height;
            const padding = { top: 60, right: 60, bottom: 60, left: document.fullscreenElement ? 300 : 60 };
            let scaleX = (w - (padding.left + padding.right)) / spanX;
            let scaleY = (h - (padding.top + padding.bottom)) / spanY;
            let scale = Math.min(scaleX, scaleY) * zoom;
            
            let worldX = (sx - panX - (padding.left + (w - (padding.left + padding.right) - spanX * scale) / 2 - minX * scale)) / scale;
            let worldY = -( (sy - panY - (padding.top + (h - (padding.top + padding.bottom) - spanY * scale) / 2 - minY * scale)) / scale );

            return { x: worldX, y: worldY };
        }

        function drawHexagon(ctx, x, y, r, fill, stroke, isRoute) {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                let angle = i * Math.PI / 3;
                if (i === 0) ctx.moveTo(x + r * Math.cos(angle), y + r * Math.sin(angle));
                else ctx.lineTo(x + r * Math.cos(angle), y + r * Math.sin(angle));
            }
            ctx.closePath();
            ctx.fillStyle = fill; ctx.fill();
            if (stroke) { 
                ctx.strokeStyle = stroke; 
                ctx.lineWidth = isRoute ? 2 : 1; 
                ctx.stroke(); 
            }
        }

        const tooltip = document.getElementById("tooltip");
        
        canvas.addEventListener('wheel', e => {
            e.preventDefault();
            
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const worldCoordsBefore = fromPixels(mouseX, mouseY);

            const zoomAmount = 1.1;
            if (e.deltaY < 0) {
                zoom *= zoomAmount;
            } else {
                zoom /= zoomAmount;
            }
            zoom = Math.max(0.5, Math.min(zoom, 20));

            const screenCoordsAfter = toPixels(worldCoordsBefore.x, worldCoordsBefore.y);

            panX += mouseX - screenCoordsAfter.x;
            panY += mouseY - screenCoordsAfter.y;
        });

        canvas.addEventListener('mousedown', e => {
            if (e.button !== 0) return; // Only pan with left-click
            isPanning = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
            canvas.style.cursor = 'grabbing';
        });

        canvas.addEventListener("click", (e) => {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            let r_scaled = 3 * currentSizeFactor * 1.5;
            let hitRadius = Math.max(10, r_scaled * 2.5);
            let clickedSystem = null;

            for (let sys in MAP_COORDINATES) {
                let pt = toPixels(...MAP_COORDINATES[sys]);
                if (Math.hypot(mx - pt.x, my - pt.y) < hitRadius) {
                    clickedSystem = sys;
                    break;
                }
            }

            if (searchedSystem && clickedSystem !== searchedSystem) {
                searchedSystem = null;
            }

            if (clickedSystem) {
                if (activeRouteTarget === clickedSystem) {
                    activeRouteTarget = null;
                } else {
                    activeRouteTarget = clickedSystem;
                }
                if (clickedSystem === searchedSystem) {
                    searchedSystem = null;
                }
            } else {
                activeRouteTarget = null;
            }
        });

        canvas.addEventListener('mouseup', e => {
            if (e.button !== 0) return;
            isPanning = false;
            canvas.style.cursor = 'default';
        });

        canvas.addEventListener("mousemove", (e) => {
            if (isPanning) {
                panX += e.clientX - lastMouseX;
                panY += e.clientY - lastMouseY;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                tooltip.style.display = "none";
                return;
            }
        
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            let r_scaled = 3 * currentSizeFactor * 1.5;
            let hitRadius = Math.max(10, r_scaled * 2.5);
            let systemHovered = null;
        
            // Find which system is being hovered
            for (let sys in MAP_COORDINATES) {
                let pt = toPixels(...MAP_COORDINATES[sys]);
                if (Math.hypot(mx - pt.x, my - pt.y) < hitRadius) {
                    systemHovered = sys;
                    break;
                }
            }
        
            if (systemHovered) {
                canvas.style.cursor = 'pointer';
                const alert = activeAlerts[systemHovered];
                if (alert && !alert.cleared) {
                    tooltip.style.display = "block";
                    tooltip.style.left = (e.clientX + 15) + "px";
                    tooltip.style.top = (e.clientY + 15) + "px";
                    
                    let tagColor = alert.is_spike ? "#ff8c00" : "#ff333c";
                    let content = `<strong style="color:${tagColor}">${systemHovered} ${alert.is_spike ? "SPIKE " : ""}ALERT</strong>`;

                    // Always show the trigger intel first
                    content += `<br><br><span style="color:#aaa;">${alert.trigger_intel || "No intel data available"}</span>`;

                    const shipsInAlert = alert.ships ? Object.keys(alert.ships) : [];
                    if (shipsInAlert.length > 0) {
                        content += '<br><br>';
                        content += shipsInAlert.map(shipName => {
                            const ship = ALL_SHIP_DATA[shipName];
                            const count = alert.ships[shipName] > 1 ? ` x${alert.ships[shipName]}` : '';
                            return ship ? `<strong>${ship.name}</strong>${count} (${ship.faction_category} ${ship.class})` : `${shipName}${count}`;
                        }).join('<br>');
                    }
                    tooltip.innerHTML = content;
                } else {
                    tooltip.style.display = "none";
                }
            } else {
                tooltip.style.display = "none";
                canvas.style.cursor = "default";
            }
        });

        canvas.addEventListener("mouseleave", () => { 
            isPanning = false; 
            tooltip.style.display = "none"; 
            canvas.style.cursor = 'default'; 
            // The ship info box is no longer controlled by canvas hover/leave
        });

        function renderMap() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            updateTrafficLights();

            let activeRoute = activeRouteTarget ? findRoute(HOME_SYSTEM, activeRouteTarget, jbEnabled) : [];
            let routeSet = new Set(activeRoute);
            let routeEdges = new Set();

            for (let i = 0; i < activeRoute.length - 1; i++) {
                routeEdges.add(activeRoute[i] + "-" + activeRoute[i+1]);
                routeEdges.add(activeRoute[i+1] + "-" + activeRoute[i]);
            }

            // Draw NPC connections
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = NPC_COLOR;
            ctx.beginPath();
            for (let conn of RAW_CONNECTIONS) {
                if (NPC_SYSTEMS.has(conn[0]) && NPC_SYSTEMS.has(conn[1]) && !routeEdges.has(conn[0] + "-" + conn[1])) {
                    if (MAP_COORDINATES[conn[0]] && MAP_COORDINATES[conn[1]]) {
                        let pt1 = toPixels(...MAP_COORDINATES[conn[0]]);
                        let pt2 = toPixels(...MAP_COORDINATES[conn[1]]);
                        ctx.moveTo(pt1.x, pt1.y);
                        ctx.lineTo(pt2.x, pt2.y);
                    }
                }
            }
            ctx.stroke();

            // Draw regular connections
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = "rgba(45, 55, 50, 0.8)";
            ctx.beginPath();
            for (let conn of RAW_CONNECTIONS) {
                if (!(NPC_SYSTEMS.has(conn[0]) && NPC_SYSTEMS.has(conn[1])) && !routeEdges.has(conn[0] + "-" + conn[1]) && MAP_COORDINATES[conn[0]] && MAP_COORDINATES[conn[1]]) {
                    let pt1 = toPixels(...MAP_COORDINATES[conn[0]]);
                    let pt2 = toPixels(...MAP_COORDINATES[conn[1]]);
                    ctx.moveTo(pt1.x, pt1.y);
                    ctx.lineTo(pt2.x, pt2.y);
                }
            }
            ctx.stroke();

            if (jbEnabled) {
                ctx.lineWidth = 2;
                ctx.strokeStyle = "rgba(77, 166, 255, 0.5)";
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                for (let conn of JUMP_BRIDGES) {
                    if (!routeEdges.has(conn[0] + "-" + conn[1]) && MAP_COORDINATES[conn[0]] && MAP_COORDINATES[conn[1]]) {
                        let pt1 = toPixels(...MAP_COORDINATES[conn[0]]);
                        let pt2 = toPixels(...MAP_COORDINATES[conn[1]]);
                        ctx.moveTo(pt1.x, pt1.y);
                        ctx.lineTo(pt2.x, pt2.y);
                    }
                }
                ctx.stroke();
                ctx.setLineDash([]);
            }
 
            if (activeRoute.length > 0) {
                const jumpBridgeConnections = new Set();
                JUMP_BRIDGES.forEach(conn => {
                    jumpBridgeConnections.add(`${conn[0]}-${conn[1]}`);
                    jumpBridgeConnections.add(`${conn[1]}-${conn[0]}`);
                });

                // Draw gate jumps (green)
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#00ff00';
                ctx.beginPath();
                for (let i = 0; i < activeRoute.length - 1; i++) {
                    const sys1 = activeRoute[i];
                    const sys2 = activeRoute[i+1];
                    if (!jbEnabled || !jumpBridgeConnections.has(`${sys1}-${sys2}`)) {
                        let pt1 = toPixels(...MAP_COORDINATES[sys1]);
                        let pt2 = toPixels(...MAP_COORDINATES[sys2]);
                        ctx.moveTo(pt1.x, pt1.y); 
                        ctx.lineTo(pt2.x, pt2.y);
                    }
                }
                ctx.stroke();

                // Draw bridge jumps (solid blue)
                if (jbEnabled) {
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#4da6ff'; // A nice bright blue
                    ctx.beginPath();
                    for (let i = 0; i < activeRoute.length - 1; i++) {
                        const sys1 = activeRoute[i];
                        const sys2 = activeRoute[i+1];
                        if (jumpBridgeConnections.has(`${sys1}-${sys2}`)) {
                            let pt1 = toPixels(...MAP_COORDINATES[sys1]);
                            let pt2 = toPixels(...MAP_COORDINATES[sys2]);
                            ctx.moveTo(pt1.x, pt1.y); 
                            ctx.lineTo(pt2.x, pt2.y);
                        }
                    }
                    ctx.stroke();
                }
            }

            let baseNode = toPixels(...MAP_COORDINATES[HOME_SYSTEM]);
            let sizeFactor = Math.max(1.0, Math.min(2.0, 1.0 + (baseNode.scale - 4.02e-15) * (1.0 / Math.max(1e-20, (6.39e-15 - 4.02e-15)))));
            currentSizeFactor = sizeFactor;
            let r_scaled = 3 * sizeFactor * 1.5;

            for (let sys in MAP_COORDINATES) {
                let pt = toPixels(...MAP_COORDINATES[sys]);

                const isNpcSystem = NPC_SYSTEMS.has(sys);
                const baseBgColor = "#202020";
                let bgCol = baseBgColor;
                let borderCol = isNpcSystem ? NPC_COLOR : "#383838";

                let isRouteNode = routeSet.has(sys);
                if(isRouteNode) borderCol = "#00ff00";

                let popScale = 1.0;
                if (popAnimations[sys]) {
                    let elapsed = Date.now() - popAnimations[sys];
                    if (elapsed < 1000) {
                        popScale = 1.0 + (0.8 * (1 - (elapsed / 1000))); 
                    } else {
                        delete popAnimations[sys];
                    }
                }

                let alertSizeMult = (sys === "C-N4OD") ? 1.4 : 1.0;
                let hasActiveAlert = false;
                let alertCount = "";
                const isSearched = sys === searchedSystem;
                
                if (activeAlerts[sys]) {
                    let al = activeAlerts[sys];
                    let now = Date.now() / 1000;
                    let ratio = Math.max(0, Math.min(1, (al.expiry - now) / ALERT_DURATION));

                    if (!al.cleared) {
                        hasActiveAlert = true;
                        alertSizeMult = 1.4; 
                        if (al.count) alertCount = al.count;
                        
                        let targetCol = "#00ff00"; // Default to green for 3+ jumps, as per original logic
                        if (al.is_spike) { 
                            targetCol = "#ff8c00"; 
                            borderCol = isRouteNode ? "#00ff00" : "#ffffff";
                        } else if (al.dist <= RED_ALERT_DISTANCE) { 
                            targetCol = "#ff333c"; 
                            borderCol = isRouteNode ? "#00ff00" : "#ffffff";
                        } else if (al.dist <= YELLOW_ALERT_DISTANCE) { 
                            targetCol = "#fcee0a"; 
                            borderCol = isRouteNode ? "#00ff00" : "#ffffff"; 
                        }
                        bgCol = blendColors(targetCol, baseBgColor, ratio);
                    } else {
                        bgCol = blendColors("#004400", baseBgColor, ratio);
                    }
                }

                if (isSearched) {
                    bgCol = "#ffffff";
                    borderCol = "#ffffff";
                    alertSizeMult = 1.4;
                }


                ctx.shadowBlur = (bgCol !== "#202020" && bgCol !== "#004400" && !isRouteNode) || isSearched ? 15 : 0;
                ctx.shadowColor = isSearched ? "#ffffff" : (isRouteNode ? "#00ff00" : bgCol);

                let finalRadius = r_scaled * popScale * alertSizeMult;

                if (sys === HOME_SYSTEM) {
                    let time = Date.now() / 1000;
                    let homeHasAlert = activeAlerts[HOME_SYSTEM] && !activeAlerts[HOME_SYSTEM].cleared;
                    let homeColor = "#ffffff";

                    if (homeHasAlert) {
                        let alertAge = (Date.now() - (alertStartTimes[HOME_SYSTEM] || Date.now())) / 1000;
                        if (alertAge <= 5) {
                            homeColor = ((time % 1.0) < 0.5) ? "#ff333c" : "#ffffff";
                        } else {
                            homeColor = "#ff333c"; 
                        }
                    }
                    drawHexagon(ctx, pt.x, pt.y, finalRadius * 1.5, homeColor, isRouteNode ? "#00ff00" : null, isRouteNode);
                } else {
                    ctx.beginPath(); ctx.arc(pt.x, pt.y, finalRadius, 0, Math.PI * 2);
                    ctx.fillStyle = bgCol; ctx.fill(); 
                    ctx.strokeStyle = borderCol; 
                    ctx.lineWidth = isRouteNode ? 2 : 1;
                    ctx.stroke();
                }
                
                ctx.shadowBlur = 0;
                
                let innerText = "";
                if (hasActiveAlert && alertCount) {
                    innerText = alertCount;
                } else if (jbEnabled && systemDistances[sys] !== undefined && sys !== HOME_SYSTEM) {
                    innerText = systemDistances[sys];
                }

                if (innerText !== "") {
                    let innerFontSize = Math.max(7, 6 * sizeFactor);
                    ctx.fillStyle = getContrastYIQ(bgCol);
                    ctx.font = `700 ${innerFontSize}px 'Rajdhani', sans-serif`;
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText(innerText, pt.x, pt.y + 1);
                }
            }

            ctx.shadowBlur = 0;
            let drawnTextBoxes = [];

            for (let sys in MAP_COORDINATES) {
                let isRouteNode = routeSet.has(sys);
                const isOutOfRegionLinkSystem = OUT_OF_REGION_LINKS.hasOwnProperty(sys);
                const isSearchedSystem = sys === searchedSystem;
                if (sys === HOME_SYSTEM || sys === "C-N4OD" || isRouteNode || (activeAlerts[sys] && !activeAlerts[sys].cleared) || showNamesEnabled || isOutOfRegionLinkSystem || isSearchedSystem) {
                    let pt = toPixels(...MAP_COORDINATES[sys]);

                    let fontSize = Math.max(7, 6 * sizeFactor);
                    ctx.fillStyle = "#ffffff";
                    ctx.font = `700 ${fontSize}px 'Rajdhani', sans-serif`;
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";

                    let displayString = sys;                    
                    if (activeAlerts[sys] && activeAlerts[sys].is_spike && !isRouteNode) {
                        ctx.fillStyle = "#ff4500";
                    }

                    let textWidth = ctx.measureText(displayString).width;
                    let textHeight = fontSize;

                    let alertSizeMult = ((activeAlerts[sys] && !activeAlerts[sys].cleared) || sys === "C-N4OD" || isSearchedSystem) ? 1.4 : 1.0;
                    let finalRadius = r_scaled * alertSizeMult;

                    let tx = pt.x;
                    let ty = pt.y - finalRadius - (fontSize / 2) - 3;
                    let collision = true;
                    let maxIter = 0;
                    while (collision && maxIter < 15) {
                        collision = false;
                        for (let box of drawnTextBoxes) {
                            if (Math.abs(tx - box.x) < (textWidth/2 + box.w/2 + 2) &&
                                Math.abs(ty - box.y) < (textHeight/2 + box.h/2 + 2)) {
                                collision = true;
                                ty -= (textHeight + 2); 
                                break;
                            }
                        }
                        maxIter++;
                    }
                    
                    drawnTextBoxes.push({x: tx, y: ty, w: textWidth, h: textHeight});
                    ctx.fillText(displayString, tx, ty);
                }
            }

            // Draw out-of-region link text below the system nodes
            for (const sys in OUT_OF_REGION_LINKS) {
                if (MAP_COORDINATES[sys]) {
                    const pt = toPixels(...MAP_COORDINATES[sys]);
                    const fontSize = Math.max(7, 6 * sizeFactor);
                    const regionFontSize = fontSize * 0.8;

                    const alertSizeMult = ((activeAlerts[sys] && !activeAlerts[sys].cleared) || sys === "C-N4OD") ? 1.4 : 1.0;
                    const finalRadius = r_scaled * alertSizeMult;

                    ctx.fillStyle = "#888";
                    ctx.font = `italic 500 ${regionFontSize}px 'Rajdhani', sans-serif`;
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";

                    const regionText = OUT_OF_REGION_LINKS[sys];
                    const regionTextWidth = ctx.measureText(regionText).width;
                    const regionTextHeight = regionFontSize;

                    let region_tx = pt.x;
                    let region_ty = pt.y + finalRadius + (regionFontSize / 2) + 5; // Below the circle

                    let collision = true;
                    let maxIter = 0;
                    while (collision && maxIter < 10) {
                        collision = false;
                        for (const box of drawnTextBoxes) {
                            if (Math.abs(region_tx - box.x) < (regionTextWidth / 2 + box.w / 2 + 5) &&
                                Math.abs(region_ty - box.y) < (regionTextHeight / 2 + box.h / 2 + 2)) {
                                collision = true;
                                region_ty += (regionTextHeight + 2); // Move down
                                break;
                            }
                        }
                        maxIter++;
                    }

                    drawnTextBoxes.push({ x: region_tx, y: region_ty, w: regionTextWidth, h: regionTextHeight });
                    ctx.fillText(regionText, region_tx, region_ty);
                }
            }

            requestAnimationFrame(renderMap);
        }

        let lastTimeDigits = { m: -1 };
        function updateEveTime() {
            const now = new Date();
            const hours = now.getUTCHours();
            const minutes = now.getUTCMinutes();

            if (minutes === lastTimeDigits.m) return; // No need to update, already did this minute

            const time = {
                h1: Math.floor(hours / 10), h2: hours % 10,
                m1: Math.floor(minutes / 10), m2: minutes % 10,
            };

            const digitHeight = 20; // Must match CSS height of .digit-container

            for (const digitId in time) {
                const strip = document.querySelector(`.digit-container[data-digit="${digitId}"] .digit-strip`);
                if (strip) strip.style.top = `-${time[digitId] * digitHeight}px`;
            }
            lastTimeDigits = {m: minutes};
        }

        // --- INITIALIZATION ---
        function initialize() {
            try {
                const mapDataElement = document.getElementById('map-data');
                const data = JSON.parse(mapDataElement.textContent.trim());
                
                // Populate global variables with fetched data
                MAP_COORDINATES = data.MAP_COORDINATES;
                RAW_CONNECTIONS = data.RAW_CONNECTIONS;
                JUMP_BRIDGES = data.JUMP_BRIDGES;
                NPC_SYSTEMS = new Set(data.NPC_SYSTEMS);
                OUT_OF_REGION_LINKS = data.OUT_OF_REGION_LINKS;

                console.log("Successfully loaded map data from HTML.");

            } catch (error) {
                console.error("Could not load or parse embedded map data:", error);
                // Fallback or error message
                document.querySelector('.log-feed').innerHTML += `<div class="log-entry" style="color:red;">[CRITICAL] Failed to load map data. Map will not function.</div>`;
                return; // Stop initialization if map data fails
            }

            // Now that data is loaded, initialize UI elements that depend on it
            const systemSelect = document.getElementById("systemSelect");
            const currentSystemText = document.getElementById("currentSystemText");
            const jbToggle = document.getElementById("jbToggle");
            const namesToggle = document.getElementById("namesToggle");
            const systemSearchInput = document.getElementById('systemSearchInput');
            const systemSearchBtn = document.getElementById('systemSearchBtn');
            const resetViewBtn = document.getElementById("resetViewBtn");
            const settingsModal = document.getElementById("settings-modal");
            const settingsIcon = document.getElementById("settings-icon");
            const saveSettingsBtn = document.getElementById("save-settings");
            const flashAlertsToggle = document.getElementById('flash-alerts-toggle');
            const testModeToggle = document.getElementById('test-mode-toggle');
            const testControlsContainer = document.getElementById('test-controls-container');

            const sortedSystems = Object.keys(MAP_COORDINATES).sort();
            sortedSystems.forEach(sys => {
                let opt = document.createElement("option");
                opt.value = sys;
                opt.textContent = sys;
                if (sys === HOME_SYSTEM) opt.selected = true;
                systemSelect.appendChild(opt);
            });
            currentSystemText.textContent = `CURRENT SYSTEM: ${HOME_SYSTEM}`;

            // Add event listeners
            systemSelect.addEventListener("change", updateSystemText);
            jbToggle.addEventListener("change", () => { jbEnabled = jbToggle.checked; if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "toggle_jb", enabled: jbEnabled })); });
            namesToggle.addEventListener("change", (e) => { showNamesEnabled = e.target.checked; });
            systemSearchBtn.addEventListener('click', performSearch);
            systemSearchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') performSearch(); });
            systemSearchInput.addEventListener('focus', (e) => e.target.select());
            resetViewBtn.addEventListener('click', () => { zoom = 1.0; panX = 0; panY = 0; });

            // Flash Alerts Setup
            flashAlertsToggle.checked = enableFlashAlerts;
            flashAlertsToggle.addEventListener('change', (e) => {
                enableFlashAlerts = e.target.checked;
                localStorage.setItem("eveIntelFlashAlerts", enableFlashAlerts);
            });
            
            // Test Mode Setup
            testModeToggle.checked = isTestMode;
            if (isTestMode) {
                testControlsContainer.style.display = 'flex';
            }
            testModeToggle.addEventListener('change', (e) => {
                isTestMode = e.target.checked;
                localStorage.setItem("eveIntelTestMode", isTestMode);
                testControlsContainer.style.display = isTestMode ? 'flex' : 'none';
                if (!isTestMode) {
                    clearTestAlerts(); // Clear alerts when turning off test mode
                }
            });
            document.getElementById('testRedBtn').addEventListener('click', () => simulateAlert('red'));
            document.getElementById('testYellowBtn').addEventListener('click', () => simulateAlert('yellow'));
            document.getElementById('testSpikeBtn').addEventListener('click', () => simulateAlert('spike'));
            
            settingsIcon.addEventListener("click", () => {
                document.getElementById("alert-duration").value = ALERT_DURATION;
                document.getElementById("red-alert-dist").value = RED_ALERT_DISTANCE;
                document.getElementById("yellow-alert-dist").value = YELLOW_ALERT_DISTANCE;
                document.getElementById('volume-slider').value = alertVolume;
                document.getElementById('mute-toggle').checked = isMuted;
                document.getElementById('flash-alerts-toggle').checked = enableFlashAlerts;
                document.getElementById('test-mode-toggle').checked = isTestMode;
                settingsModal.classList.remove("modal-hidden");
                settingsModal.classList.add("modal-visible");
            });

            saveSettingsBtn.addEventListener("click", () => {
                ALERT_DURATION = parseInt(document.getElementById("alert-duration").value, 10) || 180;
                RED_ALERT_DISTANCE = parseInt(document.getElementById("red-alert-dist").value, 10) || 1;
                YELLOW_ALERT_DISTANCE = parseInt(document.getElementById("yellow-alert-dist").value, 10) || 2;

                localStorage.setItem("eveIntelAlertDuration", ALERT_DURATION);
                localStorage.setItem("eveIntelRedDistance", RED_ALERT_DISTANCE);
                localStorage.setItem("eveIntelYellowDistance", YELLOW_ALERT_DISTANCE);

                settingsModal.classList.add("modal-hidden");
                settingsModal.classList.remove("modal-visible");
            });

            settingsModal.addEventListener('click', (e) => {
                if (e.target === settingsModal) {
                    settingsModal.classList.add("modal-hidden");
                    settingsModal.classList.remove("modal-visible");
                }
            });

            // Final setup steps
            resizeCanvas();
            window.addEventListener("resize", resizeCanvas);
            calculateMapBounds();
            renderMap();
            updateEveTime();
            setInterval(updateEveTime, 1000);
        }

        initialize();
    </script>
</body>
</html>
